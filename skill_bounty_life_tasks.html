
<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg: #0a0c10;
    --bg2: #111318;
    --bg3: #181c23;
    --border: rgba(255,255,255,0.07);
    --gold: #f5c542;
    --gold2: #e6a800;
    --cyan: #00d4aa;
    --red: #ff4d6d;
    --purple: #9b72cf;
    --blue: #4a9eff;
    --text: #e8eaf0;
    --muted: #7a7f8e;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(0,212,170,0.025) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,170,0.025) 1px,transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--gold), var(--gold2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .logo-text { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
  .logo-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; }
  .season-badge { font-family: var(--mono); font-size: 11px; background: rgba(245,197,66,0.1); border: 1px solid rgba(245,197,66,0.3); color: var(--gold); padding: 5px 12px; border-radius: 20px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--bg2); padding: 4px; border-radius: 10px; }
  .tab { flex: 1; padding: 8px; border-radius: 7px; border: none; background: transparent; color: var(--muted); font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .tab.active { background: var(--bg3); color: var(--text); }
  .tab:hover:not(.active) { color: var(--text); }

  .panel { display: none; }
  .panel.active { display: block; }

  /* CATEGORY FILTER */
  .cat-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .cat-btn { font-family: var(--mono); font-size: 11px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; }
  .cat-btn.active, .cat-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: var(--bg3); }
  .cat-btn.active { color: var(--cyan); border-color: rgba(0,212,170,0.4); }

  /* TASK CARDS */
  .task-grid { display: grid; gap: 10px; }
  .task-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .task-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-1px); }
  .task-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .task-card.easy::before { background: var(--cyan); }
  .task-card.medium::before { background: var(--gold); }
  .task-card.hard::before { background: var(--red); }
  .task-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; gap: 10px; }
  .task-name { font-weight: 700; font-size: 14px; line-height: 1.4; }
  .bounty { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--gold); white-space: nowrap; background: rgba(245,197,66,0.08); border: 1px solid rgba(245,197,66,0.2); padding: 3px 10px; border-radius: 6px; flex-shrink: 0; }
  .task-desc { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
  .task-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid; }
  .tag.easy { color: var(--cyan); border-color: rgba(0,212,170,0.3); background: rgba(0,212,170,0.05); }
  .tag.medium { color: var(--gold); border-color: rgba(245,197,66,0.3); background: rgba(245,197,66,0.05); }
  .tag.hard { color: var(--red); border-color: rgba(255,77,109,0.3); background: rgba(255,77,109,0.05); }
  .tag.cat { color: var(--purple); border-color: rgba(155,114,207,0.3); background: rgba(155,114,207,0.05); }
  .tag.blue { color: var(--blue); border-color: rgba(74,158,255,0.3); background: rgba(74,158,255,0.05); }
  .run-btn { margin-top: 12px; width: 100%; padding: 8px; background: transparent; border: 1px solid rgba(0,212,170,0.4); color: var(--cyan); font-family: var(--sans); font-weight: 700; font-size: 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
  .run-btn:hover { background: rgba(0,212,170,0.08); }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ARENA */
  .skill-select { width: 100%; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border); color: var(--text); font-family: var(--sans); font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-bottom: 14px; }
  .skill-select:focus { outline: none; border-color: rgba(0,212,170,0.4); }
  .exec-area { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .exec-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

  /* TASK QUESTION DISPLAY */
  .question-box { background: var(--bg3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .q-label { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .q-text { font-size: 14px; line-height: 1.7; }
  .q-hint { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

  /* ANSWER INPUT */
  .answer-area { margin-bottom: 14px; }
  .answer-label { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .answer-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 13px; padding: 12px 14px; border-radius: 8px; resize: vertical; min-height: 90px; line-height: 1.6; }
  .answer-input:focus { outline: none; border-color: rgba(0,212,170,0.4); }

  /* THINKING LOG */
  .log { font-family: var(--mono); font-size: 11px; background: var(--bg); border-radius: 8px; padding: 12px; max-height: 220px; overflow-y: auto; line-height: 1.9; }
  .log-line.step { color: var(--cyan); }
  .log-line.think { color: var(--purple); }
  .log-line.calc { color: var(--blue); }
  .log-line.warn { color: var(--gold); }
  .log-line.ok   { color: #4ade80; }
  .log-line.err  { color: var(--red); }
  .log-line.info { color: var(--muted); }
  .log-line.ans  { color: var(--text); font-weight: bold; }

  /* SCORES */
  .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .score-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .score-label { font-size: 10px; color: var(--muted); margin-bottom: 6px; font-family: var(--mono); }
  .score-bar-wrap { background: rgba(255,255,255,0.05); border-radius: 4px; height: 5px; overflow: hidden; }
  .score-bar { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
  .score-val { font-family: var(--mono); font-size: 14px; font-weight: 700; margin-top: 6px; }
  .total-score { margin-top: 14px; background: var(--bg3); border-radius: 12px; padding: 16px; text-align: center; border: 1px solid rgba(245,197,66,0.2); }
  .total-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-family: var(--mono); }
  .total-val { font-size: 34px; font-weight: 800; color: var(--gold); font-family: var(--mono); }
  .total-sub { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: var(--mono); }

  /* VERDICT */
  .verdict-box { margin-top: 12px; background: var(--bg3); border-radius: 10px; padding: 14px; border-left: 3px solid var(--cyan); }
  .verdict-label { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 6px; }
  .verdict-text { font-size: 13px; line-height: 1.6; color: var(--text); }
  .verdict-answer { font-family: var(--mono); font-size: 12px; color: var(--cyan); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

  /* LEADERBOARD */
  .lb-header { display: grid; grid-template-columns: 40px 1fr 80px 70px 70px; gap: 8px; padding: 8px 14px; font-family: var(--mono); font-size: 10px; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .lb-row { display: grid; grid-template-columns: 40px 1fr 80px 70px 70px; gap: 8px; padding: 11px 14px; background: var(--bg2); border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); align-items: center; transition: all 0.2s; }
  .lb-row:hover { border-color: rgba(255,255,255,0.12); }
  .lb-row.me { border-color: rgba(0,212,170,0.3); background: rgba(0,212,170,0.03); }
  .rank { font-family: var(--mono); font-weight: 700; font-size: 14px; text-align: center; }
  .rank.gold { color: var(--gold); }
  .rank.silver { color: #c0c0c0; }
  .rank.bronze { color: #cd7f32; }
  .skill-name { font-weight: 700; font-size: 13px; }
  .skill-tier { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .lb-score { font-family: var(--mono); font-size: 13px; font-weight: 700; text-align: right; }
  .lb-bounty { font-family: var(--mono); font-size: 11px; color: var(--gold); text-align: right; }
  .lb-tasks { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; }

  /* HISTORY */
  .history-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .history-icon { font-size: 20px; flex-shrink: 0; }
  .history-info { flex: 1; min-width: 0; }
  .history-name { font-weight: 700; font-size: 13px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .history-score { font-family: var(--mono); font-size: 16px; font-weight: 700; flex-shrink: 0; }
  .score-s { color: #4ade80; }
  .score-a { color: var(--cyan); }
  .score-b { color: var(--gold); }
  .score-c { color: var(--red); }
  .empty-state { text-align: center; padding: 40px; color: var(--muted); font-family: var(--mono); font-size: 12px; line-height: 1.8; }

  .submit-btn { margin-top: 10px; width: 100%; padding: 9px; background: transparent; border: 1px solid rgba(245,197,66,0.4); color: var(--gold); font-family: var(--sans); font-weight: 700; font-size: 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
  .submit-btn:hover { background: rgba(245,197,66,0.08); }

  .progress-wrap { margin-top: 12px; }
  .progress-label { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 5px; }
  .progress-track { background: rgba(255,255,255,0.05); border-radius: 4px; height: 3px; }
  .progress-fill { height: 100%; border-radius: 4px; background: var(--cyan); transition: width 0.3s; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">
      <div class="logo-icon">🎯</div>
      <div>
        <div class="logo-text">SKILL BOUNTY</div>
        <div class="logo-sub">HUNTER ARENA v0.2 · LIFE EDITION</div>
      </div>
    </div>
    <div class="season-badge">SEASON 01 · LIVE</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('tasks')">任务看板</button>
    <button class="tab" onclick="switchTab('arena')">竞技场</button>
    <button class="tab" onclick="switchTab('board')">排行榜</button>
    <button class="tab" onclick="switchTab('history')">我的记录</button>
  </div>

  <!-- TASKS -->
  <div id="tab-tasks" class="panel active">
    <div class="cat-filter" id="cat-filter"></div>
    <div class="task-grid" id="task-list"></div>
  </div>

  <!-- ARENA -->
  <div id="tab-arena" class="panel">
    <select class="skill-select" id="arena-select">
      <option value="">— 选择任务 —</option>
    </select>
    <div class="exec-area">
      <div class="exec-title">
        <div class="dot" id="exec-dot" style="background:var(--muted)"></div>
        <span id="exec-status">等待任务...</span>
      </div>

      <div id="question-display" style="display:none">
        <div class="question-box">
          <div class="q-label">📋 任务题目</div>
          <div class="q-text" id="q-text"></div>
          <div class="q-hint" id="q-hint"></div>
        </div>
        <div class="answer-area">
          <div class="answer-label">// 你的 Skill 的回答（可以直接填写，或点击「自动执行」观看AI推理过程）</div>
          <textarea class="answer-input" id="user-answer" placeholder="在此输入答案或推理过程..."></textarea>
        </div>
        <div style="display:flex;gap:8px">
          <button class="run-btn" id="run-btn" onclick="runTask()" style="flex:1">▶ 自动执行 · 观看推理</button>
          <button class="run-btn" id="submit-manual-btn" onclick="submitManual()" style="flex:1;border-color:rgba(155,114,207,0.5);color:var(--purple)">✎ 手动提交答案</button>
        </div>
      </div>

      <div id="log-wrap" style="display:none;margin-top:12px">
        <div class="log" id="exec-log"></div>
        <div class="progress-wrap" id="progress-wrap" style="display:none">
          <div class="progress-label" id="progress-label">思考中...</div>
          <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        </div>
      </div>

      <div id="score-result" style="display:none">
        <div class="score-grid" id="score-cards"></div>
        <div id="verdict-wrap"></div>
        <div class="total-score">
          <div class="total-label">综合得分</div>
          <div class="total-val" id="total-val">—</div>
          <div class="total-sub" id="total-sub">—</div>
        </div>
        <button class="submit-btn" onclick="submitScore()">✓ 提交结果 · 领取赏金</button>
      </div>
    </div>
  </div>

  <!-- LEADERBOARD -->
  <div id="tab-board" class="panel">
    <div class="lb-header">
      <div>#</div><div>Skill</div>
      <div style="text-align:right">得分</div>
      <div style="text-align:right">赏金</div>
      <div style="text-align:right">任务</div>
    </div>
    <div id="lb-rows"></div>
  </div>

  <!-- HISTORY -->
  <div id="tab-history" class="panel">
    <div id="history-list"></div>
  </div>

</div>

<script>
// ===================== TASK DATABASE =====================
const TASKS = [
  // ---- 悬疑推理 ----
  {
    id:'M001', name:'书房密室谋杀案', tier:'medium', bounty:300, cat:'悬疑推理', catIcon:'🔍',
    question:`庄园书房被发现一具尸体。书房从内部上锁，唯一的窗户从外锁死。死者手中握着一张纸条，写着"13"。房间内的壁钟停在3:15。现场三名嫌疑人：管家9点就寝、厨娘声称整晚在厨房、园丁说天黑后未进入庄园。法医确认死亡时间在午夜前后。

请问：凶手是谁，密室是如何制造的？请给出推理过程。`,
    hint:`注意：壁钟、纸条上的数字、三人的供词之间存在逻辑矛盾。`,
    steps:[
      ['step','[M001] 加载悬疑推理任务...'],
      ['think','→ 分析现场线索：壁钟 3:15 · 纸条 "13" · 密室结构'],
      ['think','→ 检查三人不在场证明...'],
      ['calc', '  管家：9点就寝 → 午夜无法证实'],
      ['calc', '  厨娘：厨房整晚 → 有独立空间，不可验证'],
      ['calc', '  园丁：天黑后未入庄园 → 但未说明天黑前行动'],
      ['think','→ 分析密室机制...'],
      ['calc', '  内锁结构：线绳穿过门缝可从外拉动门闩'],
      ['think','→ 解读 "13" 的含义...'],
      ['calc', '  3:15 镜像 → 壁钟被故意拨慢制造不在场证明'],
      ['think','→ 交叉验证嫌疑人...'],
      ['warn', '  园丁供词存在时间漏洞：天黑前行动未说明'],
      ['ok',   '→ 结论：厨娘，利用线绳密室机制，壁钟为障眼法'],
      ['ok',   '[M001] 推理完成 ✓'],
    ],
    answer:`**凶手：厨娘**。密室机制：用细线穿过门缝绕过门闩，出门后拉紧使门闩落下。壁钟被故意停在3:15（镜像为12:45暗示伪造时间轴），"13"是提示时间倒读。厨娘离开厨房作案后返回，无人证实其整晚在场。`,
    scores:{ accuracy:82, reasoning:88, creativity:75, speed:80 }
  },
  {
    id:'M002', name:'五人谎言游戏', tier:'hard', bounty:500, cat:'悬疑推理', catIcon:'🔍',
    question:`五个人只有一个说真话，其余四个都说谎：
A说："B在说谎。"
B说："C和D都在说谎。"
C说："A说的是真话。"
D说："C在说谎。"
E说："B说的是真话。"

请找出那个唯一说真话的人，并证明你的推理是完备的。`,
    hint:`逐一假设每个人说真话，验证是否产生逻辑矛盾。`,
    steps:[
      ['step','[M002] 加载逻辑推断任务...'],
      ['think','→ 假设 A 说真话 → B在说谎 → B的陈述"C和D都说谎"为假 → C或D说真话 → 但只能有一人说真话，矛盾'],
      ['calc', '  A=真 → 推导矛盾，排除A'],
      ['think','→ 假设 B 说真话 → C和D都说谎 → C说"A说真话"为假 → A说谎 → A说"B在说谎"为假 → B说真话 ✓'],
      ['calc', '  B=真 → E说"B说真话"为真 → E也说真话 → 矛盾（两人说真话）'],
      ['think','→ 假设 C 说真话 → "A说真话"为真 → A也说真话 → 矛盾'],
      ['calc', '  C=真 → 推导矛盾，排除C'],
      ['think','→ 假设 D 说真话 → "C在说谎"为真 → C的"A说真话"为假 → A说谎 ✓'],
      ['calc', '  D=真 → B说谎 → B的"C和D都说谎"为假 → C或D说真话 → D说真话 ✓'],
      ['calc', '  继续验证：E说"B说真话"为假 → E说谎 ✓ · 四人均说谎 ✓'],
      ['ok',   '→ 唯一自洽解：D说真话'],
      ['ok',   '[M002] 逻辑验证完成 ✓'],
    ],
    answer:`**D说真话**。验证：D=真→C说谎→A说谎→B说谎→E说谎，B说谎说明"C和D都说谎"为假，即C或D说真，D=真满足，完全自洽。其余四人假设均导致矛盾。`,
    scores:{ accuracy:90, reasoning:95, creativity:70, speed:75 }
  },

  // ---- 综合联想 ----
  {
    id:'A001', name:'最后一块拼图', tier:'easy', bounty:150, cat:'综合联想', catIcon:'🧩',
    question:`以下五个词语之间隐藏着一个共同的联系，找出它并解释：

🌊 海浪　　🎵 音符　　💓 心跳　　🌾 麦穗　　😴 睡眠

提示：不是表面含义，而是它们共同指向的一个抽象概念。`,
    hint:`想象这五个词都在描述同一种现象的不同侧面。`,
    steps:[
      ['step','[A001] 启动跨域联想引擎...'],
      ['think','→ 提取每个词的核心特征...'],
      ['calc', '  海浪：起伏、周期性、振荡'],
      ['calc', '  音符：频率、波形、节律'],

function renderArenaSelect() {
  const sel = document.getElementById('arena-select');
  sel.innerHTML = '<option value="">— 选择任务 —</option>';
  TASKS.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = `${t.catIcon} ${t.id} · ${t.name} (+${t.bounty}pts)`;
    sel.appendChild(opt);
  });
  sel.onchange = () => {
    const task = TASKS.find(x => x.id === sel.value);
    if (task) loadQuestion(task);
    else hideQuestion();
  };
}

function loadQuestion(task) {
  currentTask = task;
  document.getElementById('q-text').innerHTML = task.question.replace(/\n/g,'<br>').replace(/`([^`]+)`/g,'<code style="font-family:var(--mono);background:var(--bg);padding:1px 5px;border-radius:3px;font-size:12px">$1</code>');
  document.getElementById('q-hint').textContent = task.hint ? '💡 ' + task.hint : '';
  document.getElementById('question-display').style.display = 'block';
  document.getElementById('log-wrap').style.display = 'none';
  document.getElementById('score-result').style.display = 'none';
  document.getElementById('user-answer').value = '';
  document.getElementById('exec-status').textContent = '题目已加载，准备作答';
  document.getElementById('exec-dot').style.background = 'var(--cyan)';
  document.getElementById('exec-dot').style.animation = 'none';
  document.getElementById('run-btn').disabled = false;
}

function hideQuestion() {
  document.getElementById('question-display').style.display = 'none';
  document.getElementById('exec-status').textContent = '等待任务...';
}

function goArena(taskId) {
  switchTab('arena');
  document.getElementById('arena-select').value = taskId;
  const task = TASKS.find(t => t.id === taskId);
  if (task) loadQuestion(task);
}

async function runTask() {
  if (running || !currentTask) return;
  running = true;
  document.getElementById('run-btn').disabled = true;
  document.getElementById('score-result').style.display = 'none';

  const logWrap = document.getElementById('log-wrap');
  const log = document.getElementById('exec-log');
  logWrap.style.display = 'block';
  log.innerHTML = '';

  document.getElementById('exec-dot').style.animation = 'pulse 1.2s infinite';
  document.getElementById('exec-status').textContent = `推理中: ${currentTask.name}`;

  const pw = document.getElementById('progress-wrap');
  const pf = document.getElementById('progress-fill');
  const pl = document.getElementById('progress-label');
  pw.style.display = 'block';
  pf.style.width = '0%';

  const steps = currentTask.steps;
  const delay = Math.min(600, 5000 / steps.length);

  for (let i = 0; i < steps.length; i++) {
    await sleep(delay + Math.random() * 200);
    const [type, text] = steps[i];
    const line = document.createElement('div');
    line.className = 'log-line ' + type;
    line.textContent = text;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    pf.style.width = Math.round(((i+1)/steps.length)*100) + '%';
    pl.textContent = ['分析题目中...','建立推理框架...','交叉验证...','整合结论...'][Math.min(Math.floor(i/steps.length*4),3)];
  }

  pw.style.display = 'none';
  document.getElementById('user-answer').value = currentTask.answer;
  await showScores();
  running = false;
  document.getElementById('run-btn').disabled = false;
}

async function submitManual() {
  if (!currentTask) return;
  const ans = document.getElementById('user-answer').value.trim();
  if (!ans) { document.getElementById('user-answer').focus(); return; }
  await showScores(true);
}

async function showScores(manual = false) {
  currentScores = { ...currentTask.scores };
  if (manual) {
    // slight randomization for manual
    Object.keys(currentScores).forEach(k => {
      currentScores[k] = Math.min(100, Math.max(50, currentScores[k] + Math.floor(Math.random()*20)-10));
    });
  }

  const names = { accuracy:'🎯 答案准确性', reasoning:'🔗 推理逻辑', creativity:'✨ 创意深度', speed:'⚡ 思维效率' };
  const colors = { accuracy:'#00d4aa', reasoning:'#4a9eff', creativity:'#9b72cf', speed:'#f5c542' };

  document.getElementById('score-cards').innerHTML = Object.entries(currentScores).map(([k,v]) => `
    <div class="score-card">
      <div class="score-label">${names[k]}</div>
      <div class="score-bar-wrap"><div class="score-bar" id="bar-${k}" style="width:0%;background:${colors[k]}"></div></div>
      <div class="score-val" style="color:${colors[k]}">${v}</div>
    </div>
  `).join('');

  document.getElementById('verdict-wrap').innerHTML = `
    <div class="verdict-box">
      <div class="verdict-label">// 参考答案</div>
      <div class="verdict-text">${currentTask.answer.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>').replace(/`([^`]+)`/g,'<code style="font-family:var(--mono);background:var(--bg);padding:1px 4px;border-radius:3px;font-size:11px">$1</code>')}</div>
    </div>
  `;

  document.getElementById('score-result').style.display = 'block';
  await sleep(100);
  Object.keys(currentScores).forEach(k => {
    const b = document.getElementById('bar-'+k);
    if (b) b.style.width = currentScores[k] + '%';
  });

  const total = Math.round(Object.values(currentScores).reduce((a,b)=>a+b,0)/4);
  const grade = total>=90?'S · 传奇级':total>=80?'A · 精英级':total>=70?'B · 高级':total>=60?'C · 进阶':'D · 见习';
  document.getElementById('total-val').textContent = total;
  document.getElementById('total-sub').textContent = grade + `  ·  赏金 +${currentTask.bounty}pts`;

  document.getElementById('exec-status').textContent = `✓ 完成: ${currentTask.name}`;
  document.getElementById('exec-dot').style.animation = 'none';
  document.getElementById('exec-dot').style.background = '#4ade80';
}

function submitScore() {
  if (!currentTask || !currentScores) return;
  const total = Math.round(Object.values(currentScores).reduce((a,b)=>a+b,0)/4);
  myHistory.unshift({ ...currentTask, scores:{...currentScores}, total });
  const me = LEADERBOARD_DATA.find(x=>x.me);
  me.score += total * 12 + currentTask.bounty;
  me.bounty += currentTask.bounty;
  me.tasks += 1;
  if (me.score > 2000) me.tier = '高级猎人';
  if (me.score > 8000) me.tier = '精英猎人';
  if (me.score > 12000) me.tier = '传奇猎人';
  currentTask = null; currentScores = null;
  document.getElementById('score-result').style.display = 'none';
  document.getElementById('exec-status').textContent = '结果已提交 ✓';
  switchTab('history');
}

function renderLeaderboard() {
  const sorted = [...LEADERBOARD_DATA].sort((a,b)=>b.score-a.score);
  document.getElementById('lb-rows').innerHTML = sorted.map((item,i) => {
    const medals = ['🥇','🥈','🥉'];
    const rClass = i===0?'gold':i===1?'silver':i===2?'bronze':'';
    return `
      <div class="lb-row ${item.me?'me':''}">
        <div class="rank ${rClass}">${i<3?medals[i]:i+1}</div>
        <div><div class="skill-name">${item.name}${item.me?' 👈':''}</div><div class="skill-tier">${item.tier}</div></div>
        <div class="lb-score">${item.score.toLocaleString()}</div>
        <div class="lb-bounty">${item.bounty.toLocaleString()}</div>
        <div class="lb-tasks">${item.tasks}</div>
      </div>`;
  }).join('');
}

function renderHistory() {
  const c = document.getElementById('history-list');
  if (!myHistory.length) { c.innerHTML = `<div class="empty-state">// 暂无记录<br>完成任务后结果显示在这里</div>`; return; }
  c.innerHTML = myHistory.map(h => {
    const g = h.total>=90?'S':h.total>=80?'A':h.total>=70?'B':h.total>=60?'C':'D';
    return `<div class="history-item">
      <div class="history-icon">${h.catIcon}</div>
      <div class="history-info">
        <div class="history-name">${h.id} · ${h.name}</div>
        <div class="history-meta">${h.cat} · 准确:${h.scores.accuracy} 推理:${h.scores.reasoning} 创意:${h.scores.creativity} 效率:${h.scores.speed} · +${h.bounty}pts</div>
      </div>
      <div class="history-score score-${g.toLowerCase()}">${g}·${h.total}</div>
    </div>`;
  }).join('');
}

function switchTab(name) {
  ['tasks','arena','board','history'].forEach((t,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', t===name);
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
  });
  if (name==='board') renderLeaderboard();
  if (name==='history') renderHistory();
}

function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }

// INIT
renderCatFilter();
renderTasks();
renderArenaSelect();
renderLeaderboard();
</script>
